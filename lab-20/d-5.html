
<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Table</title>
</head>
<body>
    <h2>Multiplication Table</h2>

    <script>
        function printTable(num) {
            for (let i = 1; i <= 10; i++) {
                document.write(
                    num + " x " + i + " = " + (num * i) + "<br>"
                );
            }
        }

        let n = 52;
        printTable(n);
    </script>
</body>
</html>
