<!DOCTYPE html>
<html>
<head>
    <title>Color Table</title>

    <style>
        table {
            border-collapse: collapse;
            margin: 50px auto;
        }

        td {
            width: 150px;
            height: 100px;
            border: 2px solid black;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            background-color: white;
        }

        td:hover {
            background-color: var(--color);
            color: white;
        }
    </style>
</head>

<body>

    <h2 style="text-align:center;">3x3 Color Table</h2>

    <table>
        <tr>
            <td style="--color: red;">Red</td>
            <td style="--color: blue;">Blue</td>
            <td style="--color: green;">Green</td>
        </tr>

        <tr>
            <td style="--color: yellow;">Yellow</td>
            <td style="--color: orange;">Orange</td>
            <td style="--color: purple;">Purple</td>
        </tr>

        <tr>
            <td style="--color: pink;">Pink</td>
            <td style="--color: brown;">Brown</td>
            <td style="--color: gray;">Gray</td>
        </tr>
    </table>

</body>
</html>
