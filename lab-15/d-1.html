<!DOCTYPE html>
<html>
<head>
    <title>Image Opacity</title>

    <style>
        img {
            width: 400px;
            height: 300px;
            opacity: 1;
            transition: opacity 0.5s;
        }

        img:hover {
            opacity: 0.4;
        }
    </style>
</head>

<body>

    <h2>Image Opacity on Mouse Over</h2>

    <img src="c:\Users\student\Pictures\Screenshots\Screenshot.png" alt="Sample Image">

</body>
</html>
