<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Blood donation form</title>
</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation Registration Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .form-container {
            max-width: 650px;
            background: #ffffff;
            margin: 30px auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 6px solid #d9534f;
        }
        h2 {
            text-align: center;
            color: #d9534f;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        fieldset {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }
        legend {
            font-weight: bold;
            color: #4a5568;
            padding: 0 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #d9534f;
            box-shadow: 0 0 0 3px rgba(217, 83, 79, 0.15);
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }
        .radio-group label, .checkbox-group label {
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
        }
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .checkbox-container input {
            margin-top: 3px;
        }
        button {
            display: block;
            width: 100%;
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Blood Donation Registration Form</h2>
    <p class="subtitle">Save a life today. Please fill out your details accurately.</p>
    
    <form action="#" method="POST">
        
        <!-- Section 1: Personal Info -->
        <fieldset>
            <legend>Donor Information</legend>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="first-name">First Name *</label>
                    <input type="text" id="first-name" name="first_name" required>
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name *</label>
                    <input type="text" id="last-name" name="last_name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="blood-group">Blood Type (If known)</label>
                    <select id="blood-group" name="blood_group">
                        <option value="unknown">Unknown</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="weight">Weight (kg) *</label>
                    <input type="text" id="weight" name="weight" placeholder="Min 50kg recommended" required>
                </div>
            </div>
        </fieldset>

        <!-- Section 2: Contact Info -->
        <fieldset>
            <legend>Contact Information</legend>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Home Address *</label>
                <textarea id="address" name="address" rows="2" required></textarea>
            </div>
        </fieldset>

        <!-- Section 3: Eligibility / Medical History Summary -->
        <fieldset>
            <legend>Basic Health Screening</legend>
            
            <div class="form-group">
                <label>Have you donated blood in the last 56 days? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="recent_donation" value="yes" required> Yes</label>
                    <label><input type="radio" name="recent_donation" value="no"> No</label>
                </div>
            </div>

            <div class="form-group">
                <label>Are you currently taking any prescription medications? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="medication" value="yes" required> Yes</label>
                    <label><input type="radio" name="medication" value="no"> No</label>
                </div>
            </div>

            <div class="form-group">
                <label for="medical-notes">List any chronic illnesses or medical conditions (if any):</label>
                <textarea id="medical-notes" name="medical_notes" rows="2" placeholder="e.g., Hypertension, Diabetes, None"></textarea>
            </div>
        </fieldset>

        <!-- Section 4: Consent -->
        <div class="form-group checkbox-container" style="margin: 20px 5px;">
            <input type="checkbox" id="consent" name="consent" required>
            <label for="consent">I certify that the information supplied above is true. I consent to undergoing standard screening protocols for blood donation. *</label>
        </div>

        <button type="submit">Submit Registration Form</button>
    </form>
</div>

</body>
</html>

</body>
</html>
