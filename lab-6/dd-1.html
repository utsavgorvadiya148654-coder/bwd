<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blood donation</title>
</head>
<body>
    <br>
        <h1 align="center"> blood donation form </h1>+
        <hr>
<br>
        <h3> blood donar information</h3>
         
        full name:
        <input type="text" name="name" placeholder="enter your name">
        <br><br>

        date of Birth :
        <input type="date" name="dob">
        <br><br>

        agr:
        <input type="number" name="age" placeholder="enter age">
        <br><br>

        Gender:
        <input type="redio" name="gender" value="male">Male
        <input type="redio" name="gender" value="female">Female
        <input type="redio" name="gender" value="other">other
        <br><br>

        blood Group:
        <select name="blood group">
            <option value="">--select blood group--</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>
        <BR><BR>
            
            Mobile number:
            <input type="tel" name="mobile" placeholder="enter mobile number">
            <br><br>

            email:
            <input type="email" name="email" placeholder="enter email">
            <br><br>

            address:
            <br>
            <textarea name="address" rows="4" cols="40"
                    placeholder="enter your address"></textarea>
            <br><br>

            city:
            <input type="text" name="city" placeholder="enter city">
            <br><br>



</form>
    
</body>
</html>
