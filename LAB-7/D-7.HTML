<!DOCTYPE html>
<html>
<head>
    <title>Text Properties</title>

    <style>
        p {
            color: blue;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
            letter-spacing: 2px;
            word-spacing: 5px;
            line-height: 1.5;
        }

        h1 {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Text Properties in CSS</h1>

    <p>
        This paragraph demonstrates different text properties
        using internal CSS.
    </p>

</body>
</html>
