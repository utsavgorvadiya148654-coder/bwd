<!DOCTYPE html>
<html>
<head>
    <title>Different Shapes</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .square {
            width: 100px;
            height: 100px;
            background-color: red;
            margin: 30px auto;
        }

        

        .circle {
            width: 100px;
            height: 100px;
            background-color: green;
            border-radius: 50%;
            margin: 30px auto;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 100px solid orange;
            margin: 30px auto;
        }

        .oval {
            width: 180px;
            height: 100px;
            background-color: purple;
            border-radius: 50%;
            margin: 30px auto;
        }
    </style>
</head>

<body>

    <h1>Different Shapes</h1>

    <h2>Square</h2>
    <div class="square"></div>

    <h2>Rectangle</h2>
    <div class="rectangle"></div>

    <h2>Circle</h2>
    <div class="circle"></div>

    <h2>Triangle</h2>
    <div class="triangle"></div>

    <h2>Oval</h2>
    <div class="oval"></div>

</body>
</html>
