<!DOCTYPE html>
<html>
<head>
    <title>Margin and Padding</title>

    <style>
        .box {
            width: 300px;
            background-color: lightblue;

            /* Padding: space inside the box */
            padding: 30px;

            /* Margin: space outside the box */
            margin: 50px;

            border: 5px solid blue;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }
    </style>
</head>

<body>

    <h1>Demonstration of Margin and Padding</h1>

    <div class="box">
        This is a box.
        <br><br>
        <b>Padding:</b> Space between the content and border.
        <br><br>
        <b>Margin:</b> Space outside the border.
    </div>

</body>
</html>
